name: Verification tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - uses: YosysHQ/setup-oss-cad-suite@853bb54f52246aa8fb4fab963f104cfb6676197a # v4
        with:
          version: '2026-09-12'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 -m pip install -r requirements.txt
      - run: python3 scripts/doctor.py --require-all
      - run: python3 scripts/check_release.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: python3 scripts/demo.py --out outputs/parity-demo
